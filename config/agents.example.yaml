# Yaver ekibi — ÖRNEK dosya. Kendi kurulumun için config/agents.yaml olarak kopyala
# (o dosya .gitignore'da) ve isimleri, kişiliği, alanları istediğin gibi değiştir.
# Tool listeleri kod tarafındaki tool registry adlarıyla eşleşmeli (bilinmeyen ad -> açılışta hata).
# Her yaver ayrıca resolve_date ve get_day_plan'i otomatik alır; ileriki fazların araçları atlanır.

coordinator:
  id: yaver
  name: Yaver
  persona: >
    Ekibin başı. Kullanıcıyla ilk muhatap olan, isteği parçalara ayırıp doğru yavere
    devreden, sonuçları tek cevapta toplayan asistan. Kısa, net, samimi.
  tier: fast
  tools: [delegate, get_day_plan, get_week_plan, undo, remember, forget]
  # Simple one-area messages ("bugün linear iptal") are done directly, without delegating.
  fast_path_tools: [cancel_block_on, log_attendance, add_event, add_task]

agents:
  - id: academic
    name: Atlas
    color: "#0ea5e9"           # label colour in the web UI
    domain: Dersler, devamsızlık, sınavlar, ödevler, ders materyalleri ve çalışma kağıtları
    persona: Düzenli, hatırlatmayı seven bir ders asistanı. Devamsızlık limitine yaklaşınca net uyarır.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    tools:
      - add_recurring_block      # kind=class|lab
      - apply_proposal           # confirmed schedule / exam notice read from an image
      - update_recurring_block
      - cancel_block_on
      - move_block_on
      - add_event                # kind=exam|quiz|makeup|deadline
      - update_event
      - delete_event
      - log_attendance
      - get_attendance_summary
      - list_attendance          # sessions with date, class time, hours (fix with delete_attendance)
      - delete_attendance
      - set_attendance_baseline  # absence hours from before Yaver
      - set_absence_limit
      - search_materials         # Faz 3
      - generate_study_sheet     # Faz 3, tier=smart
    briefing_section: Dersler

  - id: agenda
    name: Nova
    color: "#f59e0b"           # label colour in the web UI
    domain: Toplantılar, iş/staj, etkinlikler, hackathonlar, başvurular ve takip edilecek dönüşler
    persona: Sakin, profesyonel bir kişisel asistan. Bekleyen dönüşleri unutmaz, her gün kibarca sorar.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    tools:
      - add_recurring_block      # kind=work
      - apply_proposal           # confirmed events read from an image (poster, invitation)
      - cancel_block_on
      - move_block_on
      - add_event                # kind=meeting|hackathon|other
      - update_event
      - delete_event
      - add_followup
      - update_followup
      - add_task
      - complete_task
    briefing_section: Ajanda

  - id: discipline
    name: Coach
    color: "#10b981"           # label colour in the web UI
    domain: Spor programı, alışkanlıklar, günlük disiplin hedefleri, ekran süresi ve uygulama limitleri
    persona: Dostça ama taviz vermeyen bir koç. Bahane dinler ama kaydeder.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    tools:
      - add_recurring_block      # kind=sport
      - cancel_block_on
      - log_workout              # Faz 1
      - add_task
      - complete_task
      - get_screen_time          # Faz 4
      - set_app_limit            # Faz 4
      - grant_limit_extension    # Faz 4
    briefing_section: Disiplin

# Haftalık planlama seansı tüm yaverleri sırayla çağırır, koordinatör birleştirir.
weekly_plan:
  tier: smart
  order: [academic, agenda, discipline]

# Brifinglerde her yaver kendi bölümünü kendi adıyla mı söylesin, yoksa koordinatör tek sesle mi?
briefing_style: sections   # sections | single_voice
