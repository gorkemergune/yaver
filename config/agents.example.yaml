# Yaver ofisi — ÖRNEK dosya. Kendi kurulumun için config/agents.yaml olarak kopyala
# (o dosya .gitignore'da) ve isimleri, kişiliği, alanları istediğin gibi değiştir.
# Her ajan ofiste bir çalışan (docs/OFFICE.md): id'ler sabit kalsın (kayıtlar onlara bağlı),
# isim / rol / renk / masa serbest.
# Tool listeleri kod tarafındaki tool registry adlarıyla eşleşmeli (bilinmeyen ad -> açılışta hata).
# Her çalışan ayrıca resolve_date, get_day_plan, add_note ve get_notes'u (defter) otomatik alır;
# koordinatör resolve_date ve get_notes'u. İleriki fazların araçları atlanır.
#
# Ofis alanları (hepsi opsiyonel):
#   role:  ofisteki unvan ("Akademik")
#   desk:  {row: back|front, col: 0-4}; yoksa varsayılan düzen (academic arka 0, agenda ön 2,
#          discipline ön 3), sonra ilk boş masa. Koordinatör kendi odasında oturur.
#   shift: mesai planı (panelde görünür; mesai işleri O3)
#   daily_budget_usd: çalışanın günlük LLM harcama sınırı; yoksa office.daily_budget_usd.
#          Aşılınca mesai işleri durur, ofiste kırmızı nokta çıkar. Sohbet çalışmaya devam eder.

office:
  daily_budget_usd: 0.20
  # Mesai saatleri (yerel saat): dışında boştaki çalışan eve gider (masası boş, ekranı sönük);
  # o saatte bir istek gelirse ilgili çalışan "gece mesaisi"ne gelir. İkisi aynıysa ofis hep açık.
  open_at: "08:00"
  close_at: "23:00"

coordinator:
  id: yaver
  name: Yaver
  role: Chief of Staff
  shift: Gün boyu kendi odasında. Gelen her isteği doğru masaya yönlendirir; sabah brifingini ve haftalık plan taslağını hazırlar.
  persona: >
    Ekibin başı. Kullanıcıyla ilk muhatap olan, isteği parçalara ayırıp doğru yavere
    devreden, sonuçları tek cevapta toplayan asistan. Kısa, net, samimi.
  tier: fast
  tools: [delegate, get_day_plan, get_week_plan, undo, remember, forget]
  # Simple one-area messages ("bugün linear iptal") are done directly, without delegating.
  # Attendance always goes to the classes yaver: its prompt has the class-hour rules.
  fast_path_tools: [cancel_block_on, add_event, add_task, complete_task]

agents:
  - id: academic
    name: Scholar
    role: Akademik
    desk: {row: back, col: 0}
    color: "#4cbcff"           # label colour in the web UI and the office
    shift: Sınava 7 gün kala tekrar planı önerir.
    domain: Dersler, devamsızlık, sınavlar, ödevler, ders materyalleri ve çalışma kağıtları
    persona: Düzenli, hatırlatmayı seven bir ders asistanı. Devamsızlık limitine yaklaşınca net uyarır.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    tools:
      - add_recurring_block      # kind=class|lab
      - apply_proposal           # confirmed schedule / exam notice read from an image
      - update_recurring_block
      - cancel_block_on
      - move_block_on
      - add_event                # kind=exam|quiz|makeup|deadline
      - update_event
      - delete_event
      - log_attendance
      - get_attendance_summary
      - list_attendance          # sessions with date, class time, hours (fix with delete_attendance)
      - delete_attendance
      - set_attendance_baseline  # absence hours from before Yaver
      - set_absence_limit
      - add_course_alias
      - set_week_label           # "bu haftanın adı Hackathon Haftası olsun"
      - search_materials         # uploaded notes / syllabi, with file + page
      - get_syllabus             # weekly topics ("bu hafta ne işlendi?")
      - save_material            # uploaded notes -> course + week, searchable
      - generate_study_sheet     # writes with the smart tier, sources from search_materials
    briefing_section: Dersler

  - id: agenda
    name: Chrono
    role: Ajanda · Toplantılar
    desk: {row: front, col: 2}
    color: "#ffa070"           # label colour in the web UI and the office
    shift: Bekleyen takipleri her gün sorar.
    domain: Toplantılar, takvim, etkinlikler, hackathonlar, takip edilecek dönüşler (staj / iş başvuruları hariç, onlar Mentor'un) ve görevler (yapılacaklar)
    persona: Sakin, profesyonel bir kişisel asistan. Bekleyen dönüşleri unutmaz, her gün kibarca sorar.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    shift_jobs:
      - {job: deadline_watch, at: "09:15", title: Yaklaşan teslimlere bakıyor}
    tools:
      - add_recurring_block      # kind=work
      - apply_proposal           # confirmed events read from an image (poster, invitation)
      - cancel_block_on
      - move_block_on
      - add_event                # kind=meeting|hackathon|other
      - update_event
      - delete_event
      - add_followup
      - update_followup
      - add_task
      - complete_task
      - set_week_label
    briefing_section: Ajanda

  - id: discipline
    name: Coach
    role: Koç · Disiplin
    desk: {row: front, col: 3}
    color: "#ece35e"           # label colour in the web UI and the office
    shift: Spor günlerini ve ekran süresini izler; 21:00 akşam check-in'ini yapar.
    domain: Spor programı, alışkanlıklar, günlük disiplin hedefleri, ekran süresi ve uygulama limitleri
    persona: Dostça ama taviz vermeyen bir koç. Bahane dinler ama kaydeder.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    tools:
      - add_recurring_block      # kind=sport
      - cancel_block_on
      - log_workout              # Faz 1
      - add_task
      - complete_task
      - get_screen_time          # sent by the desktop app
      - set_app_limit            # Faz 4
      - grant_limit_extension    # Faz 4
    briefing_section: Disiplin

  # --- O3: the rest of the office (docs/OFFICE.md). Without a web search key (TAVILY_API_KEY /
  # BRAVE_API_KEY in .env) web_search answers "entegrasyon bekliyor" and the employee notes it.
  # shift_jobs: scheduled work (local time; weekday 0 = Monday). Kinds: web_scan (topics),
  # ads_report, social_reminders, followup_watch, deadline_watch.

  - id: career
    name: Mentor
    role: Kariyer
    desk: {row: back, col: 1}
    color: "#4fe0c8"
    domain: Kariyer - staj ve iş başvuruları, iş yerindeki projeler, mülakatlar, başvuru dönüşlerinin takibi
    persona: Hedef odaklı bir kariyer koçu. Başvuruları ve dönüş tarihlerini unutmaz, kısa ve net konuşur.
    tier: fast
    model: {groq: openai/gpt-oss-20b}
    shift: Her sabah bekleyen başvuru dönüşlerini kontrol eder ve defterine yazar.
    shift_jobs:
      - {job: followup_watch, at: "10:00", title: Bekleyen başvuru dönüşlerine bakıyor}
    tools: [add_followup, update_followup, add_task, complete_task, add_event, update_event, remember, web_search]

  - id: startup
    name: Venture
    role: Startup
    desk: {row: back, col: 2}
    color: "#ffb547"
    domain: Startup işleri - girişimin haftalık hedefleri, rakipler, sektör haberleri, yatırım ve iş geliştirme
    persona: Meraklı bir girişim analisti. Rakipleri ve haberleri takip eder, bulduğunu kaynağıyla söyler.
    tier: fast
    model: {groq: openai/gpt-oss-20b}
    shift: >-
      Her sabah startup deposuna bakar (GitHub, salt okunur): hafta teslimleri, tarihli işler
      takvime + takibe, dosyası olmayan yaklaşan işe hatırlatma. Sektör ve rakip haberlerini tarar.
    shift_jobs:
      - {job: github_watch, at: "08:15", title: Startup deposu kontrolü}
      - {job: web_scan, at: "08:30", title: Sabah rakip taraması, topics: [yapay zeka girişim haberleri, girişim yatırımları Türkiye]}
    tools: [web_search, add_task, complete_task, add_followup, update_followup, remember]

  - id: ads
    name: Metrics
    role: Reklam Analisti
    desk: {row: back, col: 3}
    color: "#ff7eb0"
    domain: Reklam performansı - Meta (Instagram/Facebook) kampanyaları, harcama, tıklama ve dönüşüm metrikleri
    persona: Sayılarla konuşan bir reklam analisti. Bir metrik bozulunca hemen fark eder, abartmaz.
    tier: fast
    model: {groq: openai/gpt-oss-20b}
    shift: >-
      Sohbete atılan Ads Manager CSV'sini ya da tablo ekran görüntüsünü kaydeder, önceki
      dönemle karşılaştırır; özet + 3 öneriyi defterine yazar. Hesap bağlanınca günlük
      performansı kendisi çeker.
    shift_jobs:
      - {job: ads_report, at: "09:30", title: Günlük reklam metrikleri}
    tools: [get_ad_report, add_task, complete_task]

  - id: content
    name: Creator
    role: İçerik Üreticisi
    desk: {row: front, col: 0}
    color: "#d29bff"
    domain: Sosyal medya içeriği - post fikirleri, içerik takvimi, paylaşım taslakları ve trendler
    persona: Yaratıcı ama pratik bir içerik üreticisi. Somut, paylaşılabilir fikirler önerir.
    tier: fast
    model: {groq: openai/gpt-oss-20b}
    shift: >-
      Pazartesi haftanın içerik takvimi taslağını defterine yazar (paylaşmaz); her gün
      trendleri tarar (web arama anahtarı varsa).
    shift_jobs:
      - {job: content_calendar, at: "10:30", weekday: 0, title: Haftalık içerik takvimi, topics: [Örnek Girişim]}
      - {job: web_scan, at: "11:00", title: Trend taraması, topics: [Instagram içerik trendleri]}
    tools: [web_search, draft_content_calendar, add_task, complete_task, add_event]

  - id: social
    name: Buddy
    role: Sosyal Çevre
    desk: {row: front, col: 1}
    color: "#86e886"
    domain: Sosyal çevre - arkadaşlar, doğum günleri, buluşmalar ve ortak planlar
    persona: Sıcak ve dikkatli bir arkadaş. Doğum günlerini ve sözleri hatırlatır.
    tier: fast
    model: {groq: openai/gpt-oss-20b}
    shift: Önümüzdeki haftanın doğum günlerini ve buluşmalarını her sabah toplar.
    shift_jobs:
      - {job: social_reminders, at: "10:30", title: Bu haftanın hatırlatmaları}
    tools: [add_event, update_event, delete_event, add_followup, update_followup, add_task, complete_task, remember]

# Haftalık planlama seansı tüm yaverleri sırayla çağırır, koordinatör birleştirir.
weekly_plan:
  tier: smart
  order: [academic, agenda, discipline]

# Brifinglerde her yaver kendi bölümünü kendi adıyla mı söylesin, yoksa koordinatör tek sesle mi?
briefing_style: sections   # sections | single_voice
