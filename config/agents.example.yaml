# Yaver ofisi — ÖRNEK dosya. Kendi kurulumun için config/agents.yaml olarak kopyala
# (o dosya .gitignore'da) ve isimleri, kişiliği, alanları istediğin gibi değiştir.
# Her ajan ofiste bir çalışan (docs/OFFICE.md): id'ler sabit kalsın (kayıtlar onlara bağlı),
# isim / rol / renk / masa serbest.
# Tool listeleri kod tarafındaki tool registry adlarıyla eşleşmeli (bilinmeyen ad -> açılışta hata).
# Her çalışan ayrıca resolve_date, get_day_plan, add_note ve get_notes'u (defter) otomatik alır;
# koordinatör resolve_date ve get_notes'u. İleriki fazların araçları atlanır.
#
# Ofis alanları (hepsi opsiyonel):
#   role:  ofisteki unvan ("Akademik")
#   desk:  {row: back|front, col: 0-4}; yoksa varsayılan düzen (academic arka 0, agenda ön 2,
#          discipline ön 3), sonra ilk boş masa. Koordinatör kendi odasında oturur.
#   shift: mesai planı (panelde görünür; mesai işleri O3)
#   daily_budget_usd: çalışanın günlük LLM harcama sınırı; yoksa office.daily_budget_usd.
#          Aşılınca mesai işleri durur, ofiste kırmızı nokta çıkar. Sohbet çalışmaya devam eder.

office:
  daily_budget_usd: 0.50

coordinator:
  id: yaver
  name: Yaver
  role: Genel Müdür
  shift: Gün boyu kendi odasında. Gelen her isteği doğru masaya yönlendirir; sabah brifingini ve haftalık plan taslağını hazırlar.
  persona: >
    Ekibin başı. Kullanıcıyla ilk muhatap olan, isteği parçalara ayırıp doğru yavere
    devreden, sonuçları tek cevapta toplayan asistan. Kısa, net, samimi.
  tier: fast
  tools: [delegate, get_day_plan, get_week_plan, undo, remember, forget]
  # Simple one-area messages ("bugün linear iptal") are done directly, without delegating.
  # Attendance always goes to the classes yaver: its prompt has the class-hour rules.
  fast_path_tools: [cancel_block_on, add_event, add_task, complete_task]

agents:
  - id: academic
    name: Atlas
    role: Akademik
    desk: {row: back, col: 0}
    color: "#4cbcff"           # label colour in the web UI and the office
    shift: Sınava 7 gün kala tekrar planı önerir.
    domain: Dersler, devamsızlık, sınavlar, ödevler, ders materyalleri ve çalışma kağıtları
    persona: Düzenli, hatırlatmayı seven bir ders asistanı. Devamsızlık limitine yaklaşınca net uyarır.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    tools:
      - add_recurring_block      # kind=class|lab
      - apply_proposal           # confirmed schedule / exam notice read from an image
      - update_recurring_block
      - cancel_block_on
      - move_block_on
      - add_event                # kind=exam|quiz|makeup|deadline
      - update_event
      - delete_event
      - log_attendance
      - get_attendance_summary
      - list_attendance          # sessions with date, class time, hours (fix with delete_attendance)
      - delete_attendance
      - set_attendance_baseline  # absence hours from before Yaver
      - set_absence_limit
      - set_week_label           # "bu haftanın adı Hackathon Haftası olsun"
      - search_materials         # uploaded notes / syllabi, with file + page
      - get_syllabus             # weekly topics ("bu hafta ne işlendi?")
      - save_material            # uploaded notes -> course + week, searchable
      - generate_study_sheet     # writes with the smart tier, sources from search_materials
    briefing_section: Dersler

  - id: agenda
    name: Deniz
    role: Ajanda · Toplantılar
    desk: {row: front, col: 2}
    color: "#ffa070"           # label colour in the web UI and the office
    shift: Bekleyen takipleri her gün sorar.
    domain: Toplantılar, iş/staj, etkinlikler, hackathonlar, başvurular, takip edilecek dönüşler ve görevler (yapılacaklar)
    persona: Sakin, profesyonel bir kişisel asistan. Bekleyen dönüşleri unutmaz, her gün kibarca sorar.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    tools:
      - add_recurring_block      # kind=work
      - apply_proposal           # confirmed events read from an image (poster, invitation)
      - cancel_block_on
      - move_block_on
      - add_event                # kind=meeting|hackathon|other
      - update_event
      - delete_event
      - add_followup
      - update_followup
      - add_task
      - complete_task
      - set_week_label
    briefing_section: Ajanda

  - id: discipline
    name: Kaan
    role: Koç · Disiplin
    desk: {row: front, col: 3}
    color: "#ece35e"           # label colour in the web UI and the office
    shift: Spor günlerini ve ekran süresini izler; 21:00 akşam check-in'ini yapar.
    domain: Spor programı, alışkanlıklar, günlük disiplin hedefleri, ekran süresi ve uygulama limitleri
    persona: Dostça ama taviz vermeyen bir koç. Bahane dinler ama kaydeder.
    tier: fast
    model: {groq: openai/gpt-oss-20b}   # on Groq (fast or fallback): the small model; limits are per model
    tools:
      - add_recurring_block      # kind=sport
      - cancel_block_on
      - log_workout              # Faz 1
      - add_task
      - complete_task
      - get_screen_time          # sent by the desktop app
      - set_app_limit            # Faz 4
      - grant_limit_extension    # Faz 4
    briefing_section: Disiplin

# Haftalık planlama seansı tüm yaverleri sırayla çağırır, koordinatör birleştirir.
weekly_plan:
  tier: smart
  order: [academic, agenda, discipline]

# Brifinglerde her yaver kendi bölümünü kendi adıyla mı söylesin, yoksa koordinatör tek sesle mi?
briefing_style: sections   # sections | single_voice
