# ÖRNEK dosya, ve her zaman TABAN: config/providers.yaml (.gitignore'da) bunun üstüne anahtar
# anahtar biner (yazmadığın anahtar - ör. yeni bir routing purpose - buradan gelir; bir tier ya da
# provider girdisi yerel dosyada varsa bütün olarak onunki). Farklar açılışta uyarı olarak loglanır.
# Model IDs change often — check each provider's console and update here, never in code.
# Verify the models exist with:  docker compose exec api python -m app.llm.check_models
#
# Default: fast = Groq (free tier, 8k tokens/min per model), fallback = Claude Haiku.
# Own Claude key? Recommended: swap them - fast = Haiku, fallback = Groq (README:
# "Kendi Claude key'in varsa"). Failover, rate-limit waits, per-yaver models and the budget
# guard follow the provider, not the tier name, so both layouts work unchanged.

tiers:
  fast:
    provider: groq
    model: openai/gpt-oss-120b
  fallback:
    provider: anthropic
    model: claude-haiku-5-5
    # Haiku 5.5 bills prompts above 100K tokens at 5x; the router trims history above this.
    max_prompt_tokens: 90000
    options:
      thinking: {type: disabled}   # cheap, fast tool routing (allowed at effort <= high)
  smart:
    provider: anthropic
    model: claude-sonnet-5-5
    options:
      effort: medium               # Sonnet 5.5 can't disable thinking; effort controls depth
  deep:
    # Opus 5.5: only purposes mapped to it below (routing.explicit_only), own monthly limit
    # DEEP_MONTHLY_BUDGET_USD (budget.tier_limits). Thinking can't be disabled; forced
    # tool_choice is rejected (the router validates tool calls instead).
    provider: anthropic
    model: claude-opus-5-5
    options:
      effort: high
  local:
    provider: ollama
    model: qwen3:8b

providers:
  groq:
    type: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rate_limit_max_wait_seconds: 8     # 429 "try again in <=8s": wait; longer -> next tier
    rate_limit_max_wait_env: GROQ_MAX_RETRY_WAIT_SEC  # .env value wins over the line above
  openrouter:
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    default_model: openai/gpt-oss-120b   # used by model checks / live tests when no tier uses it
    reports_cost: true                   # OpenRouter returns usage.cost per request
  ollama:
    type: openai_compat
    base_url_env: OLLAMA_BASE_URL
    base_url_suffix: /v1
    optional: true                       # not running locally is fine
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY

routing:
  default: fast
  failover_chain: [fast, fallback]
  purposes:
    weekly_plan: smart
    study_sheet: smart
    syllabus_parse: smart          # syllabus PDF -> topics per week
    material_map: smart            # book sections / lab sheets -> term weeks (materials ingest)
    source_notes: smart            # images of a shared notes tab -> text (course sources)
    document_classify: fast        # PDF: syllabus, notes or other (first pages)
    intent_classify: fast          # every chat message: its parts and their intents (routing)
    schedule_parse: smart          # long pasted schedules (onboarding)
    # Images go to Claude only (providers without vision are skipped):
    image_read: fallback           # Haiku: what is it, dates of a notice / poster
    schedule_image: smart          # Sonnet: timetable photo / screenshot
    document_image: smart          # Sonnet: notes, tables, slides
    ads_image: smart               # Sonnet: Ads Manager table screenshot (Metrics)
    content_calendar: smart        # Creator: weekly post drafts (one call a week)
    # Weekly jobs marked deep (Opus); nothing else may use the deep tier:
    ads_weekly_report: deep        # Metrics: week-over-week ad analysis + recommendations
    startup_weekly_review: deep    # Venture: weekly review of the startup repo
  explicit_only: [deep]
  max_tool_steps: 6
  max_invalid_tool_calls: 2      # same tier this many times, then fail over
  rate_limit_max_wait_seconds: 3 # 429 "try again in <=3s": wait on the same tier
  rate_limit_max_waits: 2        # ... at most this many times, then fail over

# Voice messages (mic button): speech to text. Not a tier - no failover.
stt:
  provider: groq
  model: whisper-large-v3
  language: tr                   # null: detect the language
  usd_per_hour: 0.111            # Groq price; at least 10 s billed per request
  min_billed_seconds: 10

# Monthly limit comes from CLAUDE_MONTHLY_BUDGET_USD in .env.
budget:
  provider: anthropic            # spend of this provider counts toward the limit
  downgrade_at: 0.8              # >= 80%: tiers below are downgraded
  downgrade:
    smart: fallback
    deep: fallback               # >= 80% of the Claude budget: weekly jobs on Haiku
  limit_at: 1.0                  # >= 100%: tiers on this provider are dropped from the chain
  allowed_at_limit: [fast, local] # ... and a chain with nothing left uses these (minus Claude)
  tier_limits:                   # tiers with their own monthly limit (inside the one above)
    deep:
      limit_env: DEEP_MONTHLY_BUDGET_USD
      over_limit: smart            # limit reached: the weekly jobs run on Sonnet
