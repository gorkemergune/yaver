[project]
name = "yaver-backend"
version = "0.1.0"
description = "Yaver API: FastAPI + Postgres/pgvector + LLM agent team"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=2.10",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openai>=3.55",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
# The backend is an application, not a library: uv only installs its dependencies.
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "tiktoken>=0.8",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live tests call real LLM APIs (cost money): excluded by default, run with `pytest -m live`.
addopts = ["--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: calls real LLM provider APIs and records spend in llm_usage"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "DTZ",      # naive datetimes (DB is UTC, display is APP_TIMEZONE)
    "RUF",
]
# Turkish user-facing text uses dotless ı / dotted İ on purpose.
allowed-confusables = ["ı", "İ"]
ignore = [
    "B008",     # FastAPI's Depends()/Query() in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic/env.py"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
