# Behind `tailscale serve` (or another HTTPS proxy) nginx itself only sees http: keep the
# proxy's X-Forwarded-Proto so the API knows the browser is on HTTPS (Secure cookie).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Access log without secrets (QA O3): the calendar feed is GET /api/calendar.ics?token=...
# (a phone's calendar can't send headers), so any token=... value in the query string is
# logged as token=***. $request is left out of the format because it carries the raw URI.
map $request_uri $yaver_log_uri {
    "~^(?<yaver_head>[^?]*\?(?:[^#]*&)?token=)[^&#]*(?<yaver_tail>.*)$" "${yaver_head}***${yaver_tail}";
    default $request_uri;
}
log_format yaver_masked '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $yaver_log_uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

# X-Forwarded-For is overwritten with the address nginx itself sees ($remote_addr), never
# appended to: a client-made X-Forwarded-For would otherwise reach the API as the first hop
# (QA Y2: a new made-up address on every try got past the login limit). Behind
# `tailscale serve` every device then shares one address - fine for a single-user app.
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log yaver_masked;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (streaming-friendly: no buffering for SSE chat responses)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # Chat images: up to 6 files of UPLOAD_MAX_MB (20) in one request
    location = /api/uploads {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 125m;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # The PWA manifest (nginx's mime.types does not know .webmanifest)
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Always revalidated: a rebuilt app shows up on the next open (home-screen PWA too)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
