# Behind `tailscale serve` (or another HTTPS proxy) nginx itself only sees http: keep the
# proxy's X-Forwarded-Proto so the API knows the browser is on HTTPS (Secure cookie).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (streaming-friendly: no buffering for SSE chat responses)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # Chat images: up to 6 files of UPLOAD_MAX_MB (20) in one request
    location = /api/uploads {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 125m;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # The PWA manifest (nginx's mime.types does not know .webmanifest)
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Always revalidated: a rebuilt app shows up on the next open (home-screen PWA too)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
