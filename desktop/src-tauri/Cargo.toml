[package]
name = "yaver-desktop"
version = "0.1.0"
description = "Yaver desktop companion: floating logo + mini chat"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
# The `_lib` suffix keeps the lib and bin names apart (cargo issue #8519 on Windows).
name = "yaver_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
