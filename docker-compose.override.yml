# Development overrides — loaded automatically by `docker compose up`.
# Windows bind mounts don't deliver file-change events into Linux containers, so file
# watchers are switched to polling.

services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  api:
    build:
      target: dev
    restart: "no"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build:
      target: dev
    restart: "no"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./web:/app
      # keep the container's Linux node_modules instead of the host's
      - /app/node_modules
    ports: !override
      - "${WEB_PORT:-8080}:5173"
