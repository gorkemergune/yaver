# Development overrides (project yaver-dev) — loaded automatically by `docker compose up`.
# Windows bind mounts don't deliver file-change events into Linux containers, so file
# watchers are switched to polling. Ports: web 8180, api 8100, db 5532 (DEV_* in .env).

services:
  db:
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5532}:5432"

  api:
    build:
      target: dev
    restart: "no"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      # personal course materials (syllabi, books, lab sheets; gitignored), read only:
      # python -m app.materials.ingest /materials
      - ./syllabus:/materials:ro
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8100}:8000"

  web:
    build:
      target: dev
    restart: "no"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./web:/app
      # keep the container's Linux node_modules instead of the host's
      - /app/node_modules
    ports: !override
      - "127.0.0.1:${DEV_WEB_PORT:-8180}:5173"
